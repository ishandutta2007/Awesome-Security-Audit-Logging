<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #8b949e; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38d430; }
      
      /* Subtle CSS keyframe animations for background elements */
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.15; }
        50% { transform: scale(1.08); opacity: 0.35; }
        100% { transform: scale(1); opacity: 0.15; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes scan {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      
      .animated-circle { transform-origin: 1050px 150px; animation: pulse 6s ease-in-out infinite; }
      .animated-card { animation: float 5s ease-in-out infinite; }
      .scan-line { stroke-dasharray: 300; animation: scan 8s linear infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="300" fill="url(#bg)" rx="16" />
  
  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" />
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="300" fill="url(#grid)" />
  </g>

  <!-- Background Animated Graphics (Kept strictly on the right side & background to avoid obscuring text) -->
  <circle class="animated-circle" cx="1050" cy="150" r="140" fill="none" stroke="url(#accent)" stroke-width="2" />
  <circle class="animated-circle" cx="1050" cy="150" r="90" fill="none" stroke="#58a6ff" stroke-width="1" stroke-dasharray="8 8" />

  <!-- Abstract Log Nodes on the Right -->
  <g class="animated-card" opacity="0.85">
    <!-- Log Card 1 -->
    <rect x="880" y="60" width="260" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="905" cy="85" r="6" fill="#3fb950" />
    <rect x="925" y="77" width="120" height="8" rx="4" fill="#8b949e" />
    <rect x="925" y="90" width="70" height="6" rx="3" fill="#484f58" />
    
    <!-- Log Card 2 -->
    <rect x="840" y="125" width="280" height="50" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5" />
    <circle cx="865" cy="150" r="6" fill="#58a6ff" />
    <rect x="885" y="142" width="150" height="8" rx="4" fill="#c9d1d9" />
    <rect x="885" y="155" width="90" height="6" rx="3" fill="#484f58" />

    <!-- Log Card 3 -->
    <rect x="890" y="190" width="240" height="50" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
    <circle cx="915" cy="215" r="6" fill="#bc8cff" />
    <rect x="935" y="207" width="110" height="8" rx="4" fill="#8b949e" />
    <rect x="935" y="220" width="60" height="6" rx="3" fill="#484f58" />
  </g>

  <!-- Accent Top Border Strip -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)" rx="3" />

  <!-- Foreground Content (Left Aligned & High Contrast) -->
  <!-- Status Badge -->
  <g transform="translate(60, 50)">
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#161b22" stroke="#238636" stroke-width="1.5" />
    <circle cx="16" cy="14" r="4" fill="#3fb950" />
    <text x="28" y="19" class="badge-text">SECURITY &amp; COMPLIANCE</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="140" class="title">Awesome Security Audit Logging</text>
  <text x="60" y="180" class="subtitle">Curated SIEM, Audit Trails, SaaS Platforms &amp; Self-Hosted Solutions</text>

  <!-- Decorative Feature Pills under subtitle -->
  <g transform="translate(60, 215)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="30" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="15" y="20" font-family="sans-serif" font-size="12" fill="#c9d1d9">🛡️ Audit Trails</text>
    
    <!-- Pill 2 -->
    <rect x="142" y="0" width="150" height="30" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="157" y="20" font-family="sans-serif" font-size="12" fill="#c9d1d9">📊 Log Management</text>

    <!-- Pill 3 -->
    <rect x="304" y="0" width="160" height="30" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="319" y="20" font-family="sans-serif" font-size="12" fill="#c9d1d9">🔒 Compliance &amp; SIEM</text>
  </g>
</svg>
